<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Croate au quotidien</title>
<meta name="theme-color" content="#d52b1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly, brisk coach — one grammar point, a handful of words, real sentences.
   IDEA: the šahovnica — each lesson is a square of the red-and-white checkerboard you fill in.
   PICTURE: the checkerboard of 24 lessons on the home screen; the exercise card in a session.
   COLOUR and TYPE: white ground, Croatian red, Adriatic blue support; Rubik titles, Inter text.
   LAYOUT: one calm column, max 680px, big tap targets, phone first. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0d1726);--ink:light-dark(#14213d,#eef2f8);--soft:light-dark(#5b6680,#a7b3c8);--card:light-dark(#f3f6fb,#15233a);--line:light-dark(#dfe5ef,#26395a);--red:#d52b1e;--blue:light-dark(#1450a3,#6aa2ff);--ok:light-dark(#1d7a46,#5fd08f);--okbg:light-dark(#e6f5ec,#123524);--kobg:light-dark(#fdecea,#3a1717)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
main{max-width:680px;margin:0 auto;padding:clamp(18px,4vw,40px) 16px 60px}
h1,h2,.big{font-family:Rubik,system-ui,sans-serif;font-weight:700;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,6vw,42px)}h2{font-size:24px}
.sub{color:var(--soft);margin:6px 0 0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.streak{text-align:right}.streak b{font:700 36px/1 Rubik,sans-serif;color:var(--red)}.streak span{display:block;color:var(--soft);font-size:13px}
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin:24px 0;border:2px solid var(--red);border-radius:10px;overflow:hidden}
.sq{aspect-ratio:1;border:0;padding:5px;font:600 13px Inter,sans-serif;display:flex;align-items:flex-end;cursor:pointer;color:var(--soft);background:var(--card)}
.sq:nth-child(12n+2),.sq:nth-child(12n+4),.sq:nth-child(12n+6),.sq:nth-child(12n+7),.sq:nth-child(12n+9),.sq:nth-child(12n+11){background:var(--bg)}
.sq.done{background:var(--red)!important;color:#fff}
.sq.cur{box-shadow:inset 0 0 0 3px var(--blue);color:var(--blue)}
.sq:disabled{cursor:default;opacity:.55}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.today{background:var(--card);border-radius:14px;padding:20px;display:grid;gap:10px}
.today .lab{color:var(--soft);font-size:14px}
.btn{font:600 17px Inter,sans-serif;min-height:52px;padding:0 22px;border-radius:12px;border:0;background:var(--red);color:#fff;cursor:pointer;width:100%}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
@media(max-width:480px){.row{grid-template-columns:1fr}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.bar{height:8px;background:var(--card);border-radius:8px;overflow:hidden;margin:4px 0 22px}.bar i{display:block;height:100%;background:var(--red);transition:width .3s}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.x{background:none;border:0;color:var(--soft);font-size:15px;cursor:pointer;min-height:44px;padding:0 6px}
.rule p{margin:10px 0}.rule b{color:var(--blue)}
.scroll{overflow-x:auto;margin:14px 0}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--soft);font-weight:600;font-size:13px}
td:first-child{color:var(--soft)}
.card{background:var(--card);border-radius:16px;padding:24px 18px;text-align:center;display:grid;gap:10px;justify-items:center}
.big{font-size:clamp(26px,7vw,38px);overflow-wrap:anywhere}.mid{font-size:clamp(20px,5vw,26px)}
.gap{color:var(--red);font-weight:700}
.hint{color:var(--soft);font-size:15px}
.spk{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--blue);cursor:pointer;display:grid;place-items:center;flex:none}
.q{color:var(--soft);margin:0 0 10px;font-size:15px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.opts.one{grid-template-columns:1fr}
@media(max-width:480px){.opts{grid-template-columns:1fr}}
.opt{min-height:56px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;font:500 17px Inter,sans-serif;cursor:pointer;padding:8px 12px}
.opt.good{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--red);background:var(--kobg)}
.build{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
.chip{min-height:44px;padding:0 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:500 17px Inter,sans-serif;cursor:pointer}
.build .chip{background:var(--bg);border-color:var(--blue)}
.chip:disabled{visibility:hidden}
input.t{width:100%;font:500 20px Inter,sans-serif;padding:12px 14px;min-height:52px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin-top:16px}
.keys{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.keys button{min-width:48px;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 18px Inter,sans-serif;cursor:pointer}
.fb{margin-top:18px;border-radius:14px;padding:16px;display:grid;gap:8px}
.fb.ok{background:var(--okbg)}.fb.ko{background:var(--kobg)}
.fb b{font-family:Rubik,sans-serif;font-size:19px}.fb small{color:var(--soft);font-size:14px}
.end{text-align:center;display:grid;gap:14px;justify-items:center}
.score{font:700 clamp(56px,14vw,88px)/1 Rubik,sans-serif;color:var(--red)}
.find{width:100%;font-size:16px;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);min-height:48px;margin:14px 0}
h3{font:600 15px Inter,sans-serif;color:var(--soft);margin:22px 0 6px}
.w{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.w div{flex:1}.w small{color:var(--soft);display:block;font-size:15px}
.note{font-size:13px;color:var(--soft);margin-top:24px}
details{border-bottom:1px solid var(--line);padding:10px 0}summary{cursor:pointer;font-weight:600;min-height:32px}
</style>
</head>

<script>

const L=[
{t:"Le verbe biti",r:["La forme courte de <b>biti</b> (sam, si, je…) ne se met <b>jamais en 1re position</b> : elle vient en 2e place. On dit « Umoran sam » ou « Ja sam umoran », jamais « Sam umoran ».","Négation : <b>nisam, nisi, nije…</b> Question : <b>Jesi li umoran ?</b> En Bosnie on entend surtout <b>Da li si umoran ?</b>"],

g:[["Ja ___ umoran.","sam",["je","si","su"]],["Mi ___ spremni.","smo",["ste","su","sam"]],["Ona ___ gladna. (elle n'a pas faim)","nije",["nisam","ne je","nisu"]],["___ li gladan? (tu)","Jesi",["Si","Je","Jesam"],"La forme courte « si » ne peut pas ouvrir la phrase : on prend la forme longue."]],
s:[["Je suis fatigué aujourd'hui.","Danas sam umoran",["Umoran sam danas","Ja sam danas umoran"]],["Tu es à la maison ?","Jesi li kod kuće",["Da li si kod kuće"]]],
c:[["Nisam gladan, hvala.","Je n'ai pas faim, merci.",["J'ai très faim, merci.","Je ne suis pas fatigué, merci.","Je suis prêt, merci."]],["Da li si spreman?","Tu es prêt ?",["Tu es fatigué ?","Tu es chez toi ?","Tu as soif ?"],"« Da li » est la façon bosnienne (et orale) de poser une question."]]},

{t:"Genre et adjectifs",r:["Le genre se voit à la terminaison : <b>masculin</b> = consonne (grad), <b>féminin</b> = -a (kuća), <b>neutre</b> = -o / -e (selo, more).","Pièges : quelques masculins en -a (tata, kolega) et des féminins en consonne (noć, stvar, ljubav).","L'adjectif s'accorde : <b>lijep</b> grad, <b>lijepa</b> kuća, <b>lijepo</b> selo."],

s:[["C'est une belle ville.","Ovo je lijep grad",["To je lijep grad"]],["La maison est vieille.","Kuća je stara",[]]],
c:[["Mostar je stvarno lijep grad.","Mostar est vraiment une belle ville.",["Mostar est une ville très ancienne.","Mostar n'est pas une grande ville.","Mostar est un beau village."]],["Ova stvar je nova.","Cette chose est neuve.",["Cette nuit est belle.","Cette maison est neuve.","Cette chose est vieille."]]]},

{t:"Le locatif : où on est",r:["Pour dire <b>où l'on est</b> : u / na + <b>locatif</b>. Aussi après <b>o</b> (au sujet de) et <b>po</b>.","Masculin et neutre → <b>-u</b> (u Mostar<b>u</b>, na mor<b>u</b>). Féminin -a → <b>-i</b> (u kuć<b>i</b>, u crkv<b>i</b>).","<b>u</b> = dans (ville, pays, bâtiment) ; <b>na</b> = sur, et pour certains lieux : na poslu, na moru, na plaži, na aerodromu.","Devant -i, k / g / h deviennent c / z / s : ruka → u ruci, Amerika → u Americi."],
tb:[["","nominatif","locatif"],["m.","grad, Mostar","u gradu, u Mostaru"],["n.","selo, more","u selu, na moru"],["f. -a","kuća, crkva","u kući, u crkvi"],["f. consonne","noć","u noći"],["k / g / h","ruka, knjiga","u ruci, u knjizi"],["adjectif","mali grad / mala kuća","u malom gradu / u maloj kući"]],
w:[["posao (na poslu)","travail (au travail)"],["škola","école"],["ulica","rue"],["trgovina (bs : prodavnica)","magasin"],["kafić","café (le bar)"],["centar","centre-ville"],["aerodrom","aéroport"],["sjediti (sjedim)","être assis"]],
g:[["Živim u ___. (Sarajevo)","Sarajevu",["Sarajevo","Sarajeva","Sarajevom"]],["Sad sam na ___. (posao)","poslu",["posao","posla","poslom"],"Posao perd son -a- quand on ajoute une terminaison : posl-u."],["Čekam te u ___. (crkva)","crkvi",["crkvu","crkve","crkva"]],["Brat živi u ___. (Amerika)","Americi",["Ameriki","Amerike","Ameriku"],"k + i devient ci."],["Živimo u maloj ___. (kuća)","kući",["kuću","kuće","kuća"]]],
s:[["Mon frère travaille à Sarajevo.","Moj brat radi u Sarajevu",["Brat mi radi u Sarajevu"]],["Nous sommes à la plage.","Mi smo na plaži",["Na plaži smo"]]],
c:[["Još sam na poslu, javim se kasnije.","Je suis encore au travail, je te fais signe plus tard.",["Je vais au travail, je t'appelle demain.","Je suis déjà rentré, je te rappelle.","Je suis encore à l'école, j'arrive."]],["Sjedimo u kafiću u centru.","On est assis dans un café du centre.",["On va boire un café au centre.","On t'attend devant le café.","On habite dans le centre."]]]},

{t:"Le génitif singulier",r:["Le génitif = « de » : provenance, appartenance, quantité, absence.","Il suit beaucoup de prépositions : <b>iz, od, do, bez, kod, ispred, iza, pored, poslije, prije, oko</b>.","Masculin / neutre → <b>-a</b> (iz grad<b>a</b>, kod brat<b>a</b>). Féminin -a → <b>-e</b> (iz Francusk<b>e</b>, bez vod<b>e</b>).","« Il n'y a pas de… » = <b>nema</b> + génitif : Nema vode."],

c:[["Nema problema, dođi kod mene poslije posla.","Pas de problème, viens chez moi après le travail.",["Pas de problème, je viens chez toi avant le travail.","Il n'y a personne, viens au travail.","Pas de souci, on se voit au travail."]],["Imaš li malo mlijeka?","Tu as un peu de lait ?",["Tu veux un peu de lait ?","Tu as du sucre ?","Tu as un verre ?"]]]},

{t:"Les nombres et les cas",r:["Après <b>1</b> : le nom s'accorde normalement (jedan brat, jedna sestra).","Après <b>2, 3, 4</b> : masculin / neutre en <b>-a</b>, féminin en <b>-e</b> (dva brata, dvije sestre). Attention : dva (m./n.) mais <b>dvije</b> (f.).","Après <b>5 et plus</b> (et malo, puno, koliko) : <b>génitif pluriel</b>, presque toujours en <b>-a</b> (pet dana, pet godina).","Irréguliers : čovjek → <b>ljudi</b> (pet ljudi) ; dijete → <b>djece</b> (dvoje djece)."],
tb:[["","1","2, 3, 4","5 et plus"],["m.","jedan dan","dva dana","pet dana"],["f.","jedna sestra","dvije sestre","pet sestara"],["n.","jedno selo","tri sela","pet sela"],["personnes","jedan čovjek","dva čovjeka","pet ljudi"],["enfants","jedno dijete","dvoje djece","petoro djece"]],
w:[["godina","année, an"],["sat","heure"],["dan","jour"],["mjesec","mois"],["tjedan (bs : sedmica)","semaine"],["čovjek / ljudi","homme / gens"],["dijete / djeca","enfant / enfants"],["koliko","combien"]],
g:[["Imam dvije ___. (sestra)","sestre",["sestra","sestru","sestara"]],["Ostajemo pet ___. (dan)","dana",["dan","dani","danu"]],["Imam trideset i pet ___. (godina)","godina",["godine","godinu","godini"],"35 se termine par 5 : génitif pluriel."],["U grupi je dvadeset ___. (čovjek)","ljudi",["čovjeka","čovjek","ljudima"]],["Koliko ___ imaš? (enfants)","djece",["dijete","djeca","djetetu"]]],

s:[["J'ai ressenti une grande paix.","Osjetio sam veliki mir",["Osjetio sam velik mir"]],["Ici, j'ai compris que Dieu m'aime.","Ovdje sam shvatio da me Bog voli",[]]],
c:[["Prije deset godina bio sam daleko od Boga.","Il y a dix ans, j'étais loin de Dieu.",["Depuis dix ans, je suis proche de Dieu.","Il y a dix ans, je suis venu ici avec Dieu.","Dans dix ans, je serai prêtre."]],["Kad sam prvi put došla u Međugorje, plakala sam cijelu misu.","La première fois que je suis venue à Medjugorje, j'ai pleuré pendant toute la Messe.",["La première fois à Medjugorje, j'ai prié toute la nuit.","Quand je viendrai à Medjugorje, j'irai à toutes les Messes.","La dernière fois à Medjugorje, j'ai raté la Messe."]]]},

{t:"Fêtes et temps liturgiques",r:["Pour une fête, on dit <b>za</b> ou <b>na</b> + accusatif : za Božić, na Uskrs, na Veliku Gospu.","Pendant une période : <b>u</b> + locatif : u korizmi, u došašću.","À Pâques, on se salue : <b>Krist je uskrsnuo!</b> — on répond <b>Uistinu je uskrsnuo!</b>"],
tb:[["français","croate"],["Noël","Božić"],["Pâques","Uskrs"],["Carême","korizma"],["Avent","došašće (bs : advent)"],["Pentecôte","Duhovi"],["Assomption (15 août)","Velika Gospa"],["Toussaint","Svi sveti"],["Vendredi saint","Veliki petak"]],
w:[["Božić","Noël"],["Uskrs","Pâques"],["korizma","Carême"],["došašće","Avent"],["Duhovi","Pentecôte"],["Velika Gospa","Assomption"],["Svi sveti","Toussaint"],["blagdan","fête religieuse"],["hodočasnik","pèlerin"],["procesija","procession"]],
g:[["Sretan ___! (Božić)","Božić",["Božića","Božiću","Božićem"]],["Za ___ idemo kući. (Uskrs)","Uskrs",["Uskrsa","Uskrsu","Uskrsom"]],["Na ___ je velika procesija. (Velika Gospa)","Veliku Gospu",["Velika Gospa","Velikoj Gospi","Velike Gospe"]],["U ___ postimo. (korizma)","korizmi",["korizmu","korizma","korizme"]]],
s:[["Joyeux Noël et bonne année !","Sretan Božić i nova godina",["Sretan Božić i sretna nova godina"]],["Christ est ressuscité !","Krist je uskrsnuo",["Hrist je uskrsnuo"]]],
c:[["Za Božić dolazi puno hodočasnika.","Pour Noël, beaucoup de pèlerins viennent.",["À Noël, peu de pèlerins viennent.","Pour Pâques, beaucoup de pèlerins viennent.","Après Noël, les pèlerins repartent."]],["Sretan blagdan svima!","Bonne fête à tous !",["Bonne année à tous !","Merci à tous !","Bon voyage à tous !"]]]}
];
const ALL=[...L.map((l,i)=>Object.assign(l,{id:'m'+i,n:String(i+1)})),...F.map((l,i)=>Object.assign(l,{id:'f'+i,n:'Foi '+(i+1)}))];
const byId=id=>ALL.find(x=>x.id===id);

const app=document.getElementById('app');
const K='hrvatski-v2';
let S={done:{},streak:0,last:null};
try{const old=JSON.parse(localStorage.getItem('hrvatski-v1')||'{}');S=Object.assign(S,{streak:old.streak||0,last:old.last||null},JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const yday=()=>{const d=new Date();d.setDate(d.getDate()-1);return ymd(d)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[.,!?…—–«»"]/g,' ').replace(/\s+/g,' ').trim();
const flat=s=>norm(s).replace(/dž/g,'dz').replace(/đ/g,'d').replace(/[čć]/g,'c').replace(/š/g,'s').replace(/ž/g,'z');
const ICON='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
let voice=null;const hasSpeech='speechSynthesis' in window;
const pick=()=>{try{const v=speechSynthesis.getVoices();voice=v.find(x=>/^hr/i.test(x.lang))||v.find(x=>/^(bs|sr)/i.test(x.lang))||null}catch(e){}};
if(hasSpeech){pick();speechSynthesis.onvoiceschanged=pick}
const say=t=>{if(!hasSpeech)return;try{const u=new SpeechSynthesisUtterance(t.replace(/\(.*?\)/g,'').replace(/\.\.\./g,'').replace(/ \/ /g,', '));u.lang=voice?voice.lang:'hr-HR';if(voice)u.voice=voice;u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
const spk=t=>`<button class="spk" data-say="${esc(t)}" aria-label="Écouter">${ICON}</button>`;
const doneCount=()=>L.filter(l=>S.done[l.id]).length;
const curIdx=()=>{const i=L.findIndex(l=>!S.done[l.id]);return i<0?null:i};
const anyDone=()=>ALL.some(l=>S.done[l.id]);
const streakNow=()=>(S.last===today()||S.last===yday())?S.streak:0;
const table=tb=>tb?`<div class="scroll"><table><thead><tr>${tb[0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${tb.slice(1).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'';
const gapHtml=q=>esc(q).replace('___','<span class="gap">___</span>');
const headBar=(lab,pct)=>`<div class="head"><button class="x" data-go="home">← Quitter</button><span class="sub" style="margin:0">${lab}</span></div><div class="bar"><i style="width:${pct}%"></i></div>`;

function home(){
  const c=curIdx(),st=streakNow(),doneToday=S.last===today();
  const sq=L.map((l,i)=>{const d=!!S.done[l.id],cur=i===c;return `<button class="sq ${d?'done':''} ${cur?'cur':''}" data-l="${l.id}" ${(!d&&!cur)?'disabled':''} title="${esc(l.t)}" aria-label="Leçon ${i+1} : ${esc(l.t)}">${i+1}</button>`}).join('');
  const lesson=c===null?`<div class="lab">Les 24 leçons sont terminées</div><h2>Révision du jour</h2><button class="btn" data-go="review">Réviser (12 questions)</button>`
   :`<div class="lab">${doneToday?'Déjà fait aujourd\'hui, tu peux continuer':'Leçon du jour'} · règle + ${L[c].w.length} mots + exercices · 8 à 10 min</div><h2>${c+1}. ${esc(L[c].t)}</h2><button class="btn" data-l="${L[c].id}">Commencer</button>`;
  const faith=F.map(l=>`<button class="opt" data-l="${l.id}" style="text-align:left">${S.done[l.id]?'✓ ':''}${esc(l.t)}</button>`).join('');
  app.innerHTML=`<div class="top"><div><h1>Croate au quotidien</h1><p class="sub">Grammaire, vocabulaire et langue parlée en Bosnie-Herzégovine · ${doneCount()} / ${L.length}</p></div><div class="streak"><b>${st}</b><span>jour${st>1?'s':''} d'affilée</span></div></div>
  <div class="board">${sq}</div>
  <div class="today">${lesson}</div>
  <h3>Parcours foi · homélies, prière, témoignages (à faire quand tu veux)</h3><div class="opts">${faith}</div>
  <div class="row"><button class="btn alt" data-go="review" ${anyDone()?'':'disabled'}>Révision</button><button class="btn alt" data-go="rules">Grammaire</button><button class="btn alt" data-go="lex">Lexique</button></div>
  <p class="note">Ta progression est gardée dans ce navigateur. Les cases rouges se rouvrent pour refaire une leçon.</p>`;
}

let ses=null;
function startLesson(id){ses={lesson:byId(id)};ruleView()}
function ruleView(){
  const l=ses.lesson;
  app.innerHTML=`${headBar('Leçon '+l.n+' · la règle',8)}<h2>${esc(l.t)}</h2><div class="rule">${l.r.map(p=>`<p>${p}</p>`).join('')}</div>${table(l.tb)}<button class="btn" data-go="vocab">Voir le vocabulaire</button>`;
}
function vocabView(){
  const l=ses.lesson;
  app.innerHTML=`${headBar('Leçon '+l.n+' · les mots',18)}<h2>${l.w.length} mots à retenir</h2>${l.w.map(w=>`<div class="w">${spk(w[0])}<div><strong>${esc(w[0])}</strong><small>${esc(w[1])}</small></div></div>`).join('')}<div class="row2"><button class="btn alt" data-go="rule">Revoir la règle</button><button class="btn" data-go="quiz">Exercices</button></div>`;
}
const vocabItems=(ws,n)=>shuffle(ws).slice(0,n).map((w,i)=>({k:(i%3===2&&!w[0].includes('/')&&!w[0].includes('(')&&w[0].length<=18)?'type':(i%2?'fh':'hf'),w}));
const itemsOf=(l,nv)=>[...vocabItems(l.w,nv),...l.g.map(g=>({k:'g',g})),...l.s.map(s=>({k:'s',s})),...l.c.map(c=>({k:'c',c}))];
function startQuiz(){
  const l=ses.lesson;
  const prev=ALL.filter(x=>S.done[x.id]&&x!==l);
  const rev=shuffle(prev.flatMap(p=>itemsOf(p,2))).slice(0,3);
  const v=vocabItems(l.w,6);
  ses.q=[...v.slice(0,3),...shuffle(l.g.map(g=>({k:'g',g}))),...v.slice(3),...l.s.map(s=>({k:'s',s})),...l.c.map(c=>({k:'c',c})),...rev];
  ses.qi=0;ses.ok=0;ses.total=ses.q.length;ses.base=25;question();
}
function startReview(){
  const done=ALL.filter(x=>S.done[x.id]);if(!done.length)return home();
  ses={lesson:null,base:0};ses.q=shuffle(done.flatMap(l=>itemsOf(l,3))).slice(0,12);ses.qi=0;ses.ok=0;ses.total=ses.q.length;question();
}
function vOpts(w,side){
  const pool=ALL.flatMap(l=>l.w);const out=[w[side]],seen=new Set(out);
  for(const x of shuffle(pool)){if(out.length>=4)break;if(!seen.has(x[side])){seen.add(x[side]);out.push(x[side])}}
  return shuffle(out);
}
const optBtns=(arr,one)=>`<div class="opts ${one?'one':''}">${arr.map(t=>`<button class="opt" data-ans="${esc(t)}">${esc(t)}</button>`).join('')}</div>`;
function question(){
  const it=ses.q[ses.qi],pct=ses.base+(ses.qi/ses.q.length)*(100-ses.base);ses.answered=false;
  const lab=(ses.lesson?'Exercices':'Révision')+' · '+(ses.qi+1)+' / '+ses.q.length;
  let body='';
  if(it.k==='hf'){it.right=it.w[1];body=`<p class="q">Que veut dire…</p><div class="card"><div class="big">${esc(it.w[0])}</div></div>${optBtns(vOpts(it.w,1))}`}
  else if(it.k==='fh'){it.right=it.w[0];body=`<p class="q">Comment dit-on en croate…</p><div class="card"><div class="big mid">${esc(it.w[1])}</div></div>${optBtns(vOpts(it.w,0))}`}
  else if(it.k==='type'){body=`<p class="q">Écris en croate</p><div class="card"><div class="big mid">${esc(it.w[1])}</div></div><input class="t" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ta réponse"><div class="keys">${['č','ć','š','ž','đ'].map(k=>`<button data-key="${k}">${k}</button>`).join('')}</div><button class="btn" data-go="check">Vérifier</button>`}
  else if(it.k==='g'){const [q,a,o]=it.g;it.right=a;body=`<p class="q">Grammaire · complète la phrase</p><div class="card"><div class="big mid">${gapHtml(q)}</div></div>${optBtns(shuffle([a,...o]),a.length>14)}`}
  else if(it.k==='c'){const [h,f,o]=it.c;it.right=f;body=`<p class="q">Compréhension · ton ami te dit :</p><div class="card"><div class="big mid">« ${esc(h)} »</div>${spk(h)}</div>${optBtns(shuffle([f,...o]),true)}`}
  else if(it.k==='s'){const [f,h]=it.s;it.tokens=shuffle(h.split(' '));it.picked=[];body=`<p class="q">Construis la phrase en croate</p><div class="card"><div class="big mid">${esc(f)}</div></div><div class="build" id="build" aria-label="Ta phrase"></div><div class="pool">${it.tokens.map((t,i)=>`<button class="chip" data-tok="${i}">${esc(t)}</button>`).join('')}</div><button class="btn" data-go="checks">Vérifier</button>`}
  app.innerHTML=headBar(lab,pct)+body+'<div id="fb"></div>';
  const a=document.getElementById('ans');if(a)a.focus();
}
function feedback(good,main,extra){
  const it=ses.q[ses.qi];ses.answered=true;
  if(good){if(!it.retry)ses.ok++}else if(!it.retry)ses.q.push(Object.assign({},it,{retry:true,k:it.k==='type'?'fh':it.k}));
  document.getElementById('fb').innerHTML=`<div class="fb ${good?'ok':'ko'}"><b>${good?'Tačno ! Bravo.':'Pas tout à fait'}</b><div>${main}</div>${extra?`<small>${extra}</small>`:''}<button class="btn" data-go="cont" id="cont">Continuer</button></div>`;
  document.getElementById('cont').focus();
}
function choose(btn){
  if(ses.answered)return;const it=ses.q[ses.qi],right=it.right;
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.ans===right)b.classList.add('good')});
  const good=btn.dataset.ans===right;if(!good)btn.classList.add('bad');
  if(it.k==='hf'||it.k==='fh')feedback(good,`<strong>${esc(it.w[0])}</strong> = ${esc(it.w[1])}`);
  else if(it.k==='g'){const full=it.g[0].replace('___',it.g[1]);feedback(good,`<strong>${esc(full)}</strong>`,it.g[3]?esc(it.g[3]):'')}
  else feedback(good,`<strong>${esc(it.c[0])}</strong><br>${esc(it.c[1])}`,it.c[3]?esc(it.c[3]):'');
}
function check(){
  if(ses.answered)return;const a=document.getElementById('ans'),v=a.value,w=ses.q[ses.qi].w;if(!v.trim())return a.focus();
  a.disabled=true;const main=`<strong>${esc(w[0])}</strong> = ${esc(w[1])}`;
  if(norm(v)===norm(w[0]))feedback(true,main);
  else if(flat(v)===flat(w[0]))feedback(true,main,'Juste, attention seulement aux signes diacritiques.');
  else feedback(false,main,'Ta réponse : '+esc(v));
}
function renderBuild(){
  const it=ses.q[ses.qi];
  document.getElementById('build').innerHTML=it.picked.map((ti,p)=>`<button class="chip" data-un="${p}">${esc(it.tokens[ti])}</button>`).join('');
  document.querySelectorAll('.pool .chip').forEach(b=>b.disabled=it.picked.includes(+b.dataset.tok));
}
function checkS(){
  if(ses.answered)return;const it=ses.q[ses.qi];if(!it.picked.length)return;
  const got=norm(it.picked.map(i=>it.tokens[i]).join(' ')),[f,h,alt]=it.s;
  const ok=[h,...alt].some(x=>norm(x)===got);
  document.querySelectorAll('.chip').forEach(b=>b.disabled=true);
  feedback(ok,`<strong>${esc(h)}</strong>${alt.length?`<br><small>Aussi correct : ${alt.map(esc).join(' · ')}</small>`:''}`,ok?'':'L\'ordre des mots est assez libre, mais les petits mots (sam, je, ću, mi, se, li…) restent toujours en 2e position.');
  say(h);
}
function next(){
  ses.qi++;
  if(ses.qi<ses.q.length)return question();
  const t=today();
  if(ses.lesson)S.done[ses.lesson.id]=t;
  if(S.last!==t){S.streak=(S.last===yday())?S.streak+1:1;S.last=t}
  save();
  const pc=Math.round(ses.ok/ses.total*100),c=curIdx();
  app.innerHTML=`<div class="end"><p class="sub">${ses.lesson?'Leçon '+ses.lesson.n+' terminée':'Révision terminée'}</p><div class="score">${pc}%</div>
  <h2>${pc>=80?'Odlično !':pc>=50?'Dobro, nastavi !':'Polako, ponovi sutra.'}</h2>
  <p class="sub">${ses.ok} bonnes réponses sur ${ses.total} du premier coup · ${S.streak} jour${S.streak>1?'s':''} d'affilée</p>
  <button class="btn" data-go="home">Retour à l'accueil</button>
  ${c!==null&&ses.lesson?`<button class="btn alt" data-l="${L[c].id}">Enchaîner sur la leçon ${c+1}</button>`:''}</div>`;
  ses=null;
}
function lex(){
  const blocks=ALL.map(l=>S.done[l.id]?`<h3>${esc(l.n)}. ${esc(l.t)}</h3>${l.w.map(w=>`<div class="w" data-s="${esc(flat(w[0]+' '+w[1]))}">${spk(w[0])}<div><strong>${esc(w[0])}</strong><small>${esc(w[1])}</small></div></div>`).join('')}`:'').join('');
  app.innerHTML=`<div class="head"><button class="x" data-go="home">← Accueil</button></div><h1>Lexique</h1>
  ${blocks?`<input class="find" id="find" type="search" placeholder="Chercher un mot (croate ou français)">${blocks}`:'<p class="sub">Les mots apparaîtront ici au fil des leçons terminées.</p>'}`;
  const f=document.getElementById('find');
  if(f)f.addEventListener('input',()=>{const q=flat(f.value);document.querySelectorAll('.w').forEach(r=>r.style.display=r.dataset.s.includes(q)?'':'none')});
}
function rules(){
  const items=ALL.map((l,i)=>S.done[l.id]||i===curIdx()||l.id[0]==='f'?`<details><summary>${esc(l.n)}. ${esc(l.t)}</summary><div class="rule">${l.r.map(p=>`<p>${p}</p>`).join('')}</div>${table(l.tb)}</details>`:'').join('');
  app.innerHTML=`<div class="head"><button class="x" data-go="home">← Accueil</button></div><h1>Aide-mémoire de grammaire</h1><p class="sub">Les règles et tableaux des leçons ouvertes.</p>${items}`;
}
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.say!==undefined)return say(b.dataset.say);
  if(b.dataset.key){const a=document.getElementById('ans');if(a&&!a.disabled){const p=a.selectionStart??a.value.length;a.value=a.value.slice(0,p)+b.dataset.key+a.value.slice(a.selectionEnd??p);a.focus();a.setSelectionRange(p+1,p+1)}return}
  if(b.dataset.ans!==undefined)return choose(b);
  if(b.dataset.tok!==undefined){if(!ses.answered){ses.q[ses.qi].picked.push(+b.dataset.tok);renderBuild()}return}
  if(b.dataset.un!==undefined){if(!ses.answered){ses.q[ses.qi].picked.splice(+b.dataset.un,1);renderBuild()}return}
  if(b.dataset.l!==undefined)return startLesson(b.dataset.l);
  const g=b.dataset.go;
  if(g==='home'){ses=null;home()}
  else if(g==='review')startReview();
  else if(g==='lex')lex();
  else if(g==='rules')rules();
  else if(g==='vocab')vocabView();
  else if(g==='rule')ruleView();
  else if(g==='quiz')startQuiz();
  else if(g==='check')check();
  else if(g==='checks')checkS();
  else if(g==='cont')next();
});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ans'){e.preventDefault();check()}});
home();
}
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
